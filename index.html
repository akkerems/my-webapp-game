<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sperm Clicker PRO</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c20, #15102a);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        h1 { margin: 10px 0 5px 0; font-size: 26px; color: #00fff0; text-shadow: 0 0 10px rgba(0,255,240,0.5); }
        .balance-container { background: rgba(255,255,255,0.05); padding: 15px 30px; border-radius: 20px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .balance { font-size: 36px; font-weight: bold; color: #00fff0; text-shadow: 0 0 15px rgba(0,255,240,0.8); }
        
        .click-btn {
            width: 170px; height: 170px;
            background: radial-gradient(circle, #ffffff 0%, #d4f1f9 100%);
            border-radius: 50%;
            border: 6px solid #00fff0;
            font-size: 65px; line-height: 155px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 240, 0.5);
            transition: transform 0.05s ease;
            user-select: none; margin-bottom: 35px;
        }
        .click-btn:active { transform: scale(0.90); }

        .wheel-box { position: relative; width: 200px; height: 200px; margin-bottom: 10px; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #fff;
            background: conic-gradient(#ff2a6d 0deg 60deg, #05d9e8 60deg 120deg, #3a1c71 120deg 180deg, #f5a623 180deg 240deg, #b8e986 240deg 300deg, #9013fe 300deg 360deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #ff2a6d; z-index: 10;
        }
        .spin-btn {
            background: #ff2a6d; color: white; border: none; padding: 12px 30px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255,42,109,0.4); transition: background 0.2s;
        }
        .spin-btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>💦 SPERM CLICKER</h1>
    <div class="balance-container">
        <div>Твой баланс спермы:</div>
        <div class="balance" id="balanceDisplay">0 мл</div>
    </div>

    <div class="click-btn" id="clickerBtn">💦</div>

    <h3>🎡 Колесо Удачи (Раз в минуту)</h3>
    <div class="wheel-box">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>
    <button class="spin-btn" id="spinBtn">Крутить колесо!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Загружаем сохраненный баланс именно для этого устройства
        let score = parseInt(localStorage.getItem('global_sperm_score')) || 0;
        let lastSpin = parseInt(localStorage.getItem('global_last_spin')) || 0;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const clickerBtn = document.getElementById('clickerBtn');
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');

        // Отображаем баланс сразу
        balanceDisplay.innerText = score.toLocaleString() + " мл";

        // КЛИКЕР (Работает мгновенно!)
        clickerBtn.addEventListener('click', () => {
            let clicked = Math.floor(Math.random() * 5) + 1; // от 1 до 5 мл за тап
            score += clicked;
            updateBalance();
            
            // Легкая вибрация на телефоне при клике (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // КОЛЕСО
        spinBtn.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastSpin < 60000) return;

            spinBtn.disabled = true;
            lastSpin = now;
            localStorage.setItem('global_last_spin', lastSpin);

            const randomDegrees = Math.floor(Math.random() * 360) + 1800; // 5 полных оборотов + рандом
            wheel.style.transform = `rotate(${randomDegrees}deg)`;

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            setTimeout(() => {
                const bonus = Math.floor(Math.random() * 400) + 100; // бонус от 100 до 500 мл
                score += bonus;
                updateBalance();
                alert(`🎡 Колесо принесло тебе +${bonus} мл!`);
                checkCooldown();
            }, 4000);
        });

        function updateBalance() {
            balanceDisplay.innerText = score.toLocaleString() + " мл";
            localStorage.setItem('global_sperm_score', score);
        }

        function checkCooldown() {
            const now = Date.now();
            if (now - lastSpin < 60000) {
                spinBtn.disabled = true;
                const remain = Math.ceil((60000 - (now - lastSpin)) / 1000);
                spinBtn.innerText = `Подожди ${remain} сек.`;
                setTimeout(checkCooldown, 1000);
            } else {
                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить колесо!";
            }
        }

        checkCooldown();
    </script>
</body>
</html>
