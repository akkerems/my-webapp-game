<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sperm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .balance-box { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; }
        .balance { font-size: 32px; color: #00fff0; font-weight: bold; }
        .click-btn { width: 140px; height: 140px; background: #fff; border-radius: 50%; border: 5px solid #00fff0; font-size: 50px; line-height: 130px; cursor: pointer; transition: transform 0.1s; user-select: none; margin-bottom: 30px; }
        .click-btn:active { transform: scale(0.9); }
        .wheel { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #fff; background: conic-gradient(#ff2a6d 0deg 90deg, #05d9e8 90deg 180deg, #f5a623 180deg 270deg, #9013fe 270deg 360deg); transition: transform 3s ease-out; margin-bottom: 10px; }
        .spin-btn { background: #ff2a6d; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>💦 SPERM CLICKER</h1>
    <div class="balance-box">
        <div>Натапано сейчас:</div>
        <div class="balance" id="display">0 мл</div>
    </div>

    <div class="click-btn" id="clickBtn">💦</div>

    <h3>🎡 Колесо Фортуны</h3>
    <div class="wheel" id="wheel"></div>
    <button class="spin-btn" id="spinBtn">Крутить!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let sessionClicks = 0;
        const display = document.getElementById('display');
        const clickBtn = document.getElementById('clickBtn');
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');

        // КЛИКЕР: теперь буква D большая, всё работает!
        clickBtn.addEventListener('click', () => {
            let clicked = Math.floor(Math.random() * 5) + 1;
            sessionClicks += clicked;
            display.innerText = sessionClicks + " мл";
            
            // Метод отправки данных боту
            tg.sendData("click:" + clicked);
        });

        // КОЛЕСО УДАЧИ
        spinBtn.addEventListener('click', () => {
            spinBtn.disabled = true;
            let degrees = Math.floor(Math.random() * 360) + 720;
            wheel.style.transform = `rotate(${degrees}deg)`;

            setTimeout(() => {
                let bonus = Math.floor(Math.random() * 400) + 100;
                // Тут тоже исправил на большую букву D
                tg.sendData("wheel:" + bonus);
                alert(`🎉 Колесо принесло тебе +${bonus} мл!`);
                spinBtn.disabled = false;
            }, 3000);
        });
    </script>
</body>
</html>
