<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sperm Clicker WebApp</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 5px; font-size: 24px; color: #4e9f3d; }
        .balance-container { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .balance { font-size: 28px; font-weight: bold; color: #00fff0; }
        
        /* Стили кликера */
        .click-btn {
            width: 160px; height: 160px;
            background: radial-gradient(circle, #ffffff 0%, #d4f1f9 100%);
            border-radius: 50%;
            border: 8px solid #00fff0;
            font-size: 60px; line-height: 140px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 240, 0.6);
            transition: transform 0.1s ease;
            user-select: none; margin-bottom: 40px;
        }
        .click-btn:active { transform: scale(0.92); }

        /* Стили Колеса Фортуны */
        .wheel-box { position: relative; width: 220px; height: 220px; margin-bottom: 15px; }
        .wheel {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            background: conic-gradient(#ff2a6d 0deg 60deg, #05d9e8 60deg 120deg, #01012b 120deg 180deg, #f5a623 180deg 240deg, #b8e986 240deg 300deg, #9013fe 300deg 360deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .pointer {
            position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid #ff2a6d; z-index: 10;
        }
        .spin-btn {
            margin-top: 10px; background: #ff2a6d; color: white;
            border: none; padding: 10px 25px; border-radius: 20px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,42,109,0.4);
        }
        .spin-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>💦 SPERM CLICKER</h1>
    <div class="balance-container">
        <div>Твой баланс в WebApp:</div>
        <div class="balance" id="balanceDisplay">0 мл</div>
    </div>

    <!-- КЛИКЕР -->
    <div class="click-btn" id="clickerBtn">💦</div>

    <!-- КОЛЕСО ФОРТУНЫ -->
    <h3>🎡 Колесо Удачи (1 раз в минуту)</h3>
    <div class="wheel-box">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>
    <button class="spin-btn" id="spinBtn">Крутить колесо!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран телефона

        let score = parseInt(localStorage.getItem('webapp_score')) || 0;
        let lastSpin = parseInt(localStorage.getItem('last_spin_time')) || 0;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const clickerBtn = document.getElementById('clickerBtn');
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');

        balanceDisplay.innerText = score + " мл";

        // Логика клика
        clickerBtn.addEventListener('click', () => {
            score += randomRange(5, 15);
            updateScore();
        });

        // Логика колеса
        spinBtn.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastSpin < 60000) return; // Кулдаун 1 минута

            spinBtn.disabled = true;
            lastSpin = now;
            localStorage.setItem('last_spin_time', lastSpin);

            const randomDegrees = Math.floor(Math.random() * 360) + 1440; // Минимум 4 полных оборота
            wheel.style.transform = `rotate(${randomDegrees}deg)`;

            setTimeout(() => {
                const bonus = randomRange(100, 1000);
                score += bonus;
                updateScore();
                alert(`🎉 Колесо удачи принесло тебе +${bonus} мл!`);
                checkCooldown();
            }, 4000); // Ждем окончания анимации вращения (4 секунды)
        });

        function updateScore() {
            balanceDisplay.innerText = score + " мл";
            localStorage.setItem('webapp_score', score);
        }

        function randomRange(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function checkCooldown() {
            const now = Date.now();
            if (now - lastSpin < 60000) {
                spinBtn.disabled = true;
                const remain = Math.ceil((60000 - (now - lastSpin)) / 1000);
                spinBtn.innerText = `Подожди ${remain} сек.`;
                setTimeout(checkCooldown, 1000);
            } else {
                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить колесо!";
            }
        }

        checkCooldown();
    </script>
</body>
</html>
